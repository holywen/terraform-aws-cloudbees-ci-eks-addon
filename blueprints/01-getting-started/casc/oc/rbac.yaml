removeStrategy:
  rbac: UPDATE
roles:
- name: authenticated
- name: anonymous
- permissions:
  - hudson.model.Hudson.Administer
  - hudson.model.Hudson.Read
  - hudson.model.Item.Read
  - hudson.model.Item.Configure
  - hudson.model.Item.Create
  - hudson.model.Item.Delete
  - hudson.model.Item.Build
  - hudson.model.View.Read
  - hudson.model.View.Create
  - nectar.plugins.rbac.groups.Group.Manage
  - nectar.plugins.rbac.groups.Group.CreateToken
  - nectar.plugins.rbac.groups.Group.View
  - nectar.plugins.rbac.groups.Group.Create
  - nectar.plugins.rbac.groups.Group.Configure
  - nectar.plugins.rbac.groups.Group.Delete
  - nectar.plugins.rbac.roles.Role.View
  - com.cloudbees.opscenter.server.model.ClientMaster.Configure
  - com.cloudbees.opscenter.server.model.ClientMaster.Lifecycle
  name: administer
# TEST 1 (Ticket #277627 follow-up): minimum permission set for delegated,
# non-admin service-account token lifecycle management, per
# https://docs.cloudbees.com/docs/cloudbees-ci/latest/secure/service-accounts-security
# Hudson.Read is required as the Stapler routing prerequisite; it is not
# implied by the Group/* permissions.
- filterable: false
  permissions:
  - hudson.model.Hudson.Read
  - nectar.plugins.rbac.groups.Group.Manage
  - nectar.plugins.rbac.groups.Group.CreateToken
  name: sa-token-manager
# TEST 2 (Ticket #277728): allow-list of trusted OIDC issuer domains. Only
# JWTs whose `iss` claim falls under one of these domains are accepted for
# service account OIDC authentication. Microsoft Entra ID (Azure AD) issues
# v2.0 tokens from https://login.microsoftonline.com/<tenant-id>/v2.0
serviceAccountOidcIssuerDomains:
  - login.microsoftonline.com
serviceAccounts:
# TEST 1 / Scenario A actor: root-scoped SA whose ONLY grant of
# sa-token-manager (and therefore Group/CreateToken) comes from a group
# defined at ITEM scope (controller-a, see items.yaml). Per CloudBees CI
# docs, "The Group/CreateToken permission is always checked at the root
# scope, even for item-scoped service accounts" -- so this grant is
# expected to have NO effect at all, even for controller-a's own SA.
- name: sa-scope-test-item
  authentication:
  - type: password
    id: sa-scope-test-item-token
    description: "TEST1 Scenario A actor token"
    password: cloudbees_ci_sa_c16b9db5538017cc1a6f11717e15c2bb
# TEST 1 / Scenario B actor: root-scoped SA granted sa-token-manager via a
# ROOT-scoped group (root-token-managers, below). Per the ticket's finding,
# expected to work, but WITHOUT per-controller isolation (i.e. it should be
# able to create tokens for SAs under controller-a AND controller-b alike).
- name: sa-scope-test-root
  authentication:
  - type: password
    id: sa-scope-test-root-token
    description: "TEST1 Scenario B actor token"
    password: cloudbees_ci_sa_3fded79561a05e5d08bb40f2521856aa
# TEST 1 target: root-scoped SA with no bundle-managed token. Its token is
# created/deleted purely via REST calls during the test.
- name: root-target-sa
  authentication: []
# TEST 2 (Ticket #277728): service account that will authenticate using an
# OIDC JWT minted by a Microsoft Entra ID App Registration (client
# credentials flow). The issuer/subject/audience below are placeholders --
# update them once the Entra ID app registration details are available,
# then re-apply this bundle.
# - subject: the `sub` claim of the token. For an Entra ID v2.0 token
#   obtained via client_credentials with no user context, sub == oid ==
#   the App Registration's Service Principal Object ID.
# - audience: must match the token's `aud` claim exactly. Entra ID sets
#   `aud` to whatever resource/scope was requested (e.g. api://<client-id>),
#   NOT to the service account URL, so this must be set explicitly.
- name: entra-oidc-sa
  authentication:
  - type: oidc
    id: entra-id-oidc
    issuer: "https://login.microsoftonline.com/REPLACE_WITH_TENANT_ID/v2.0"
    subject: "REPLACE_WITH_SERVICE_PRINCIPAL_OBJECT_ID"
    audience: "REPLACE_WITH_APP_ID_URI_OR_CLIENT_ID"
groups:
- members:
    users:
    - admin
  roles:
  - name: administer
    grantedAt: current
  name: Administrators
# SCENARIO B control group: sa-token-manager granted at ROOT scope.
- roles:
  - name: sa-token-manager
    grantedAt: current
  members:
    serviceAccounts:
    - sa-scope-test-root
  name: root-token-managers
# Baseline group so the OIDC/Entra test SA can read the OC and its own SA
# object once authenticated (not part of the token-scoping test).
- roles:
  - name: sa-token-manager
    grantedAt: current
  members:
    serviceAccounts:
    - entra-oidc-sa
  name: entra-sa-group
