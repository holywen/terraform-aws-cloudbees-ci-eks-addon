OperationsCenter:
  NodeSelector:
    role: ${cbciAppsNodeRole}
  Tolerations:
    - key: ${cbciAppsTolerationKey}
      operator: Equal
      value: ${cbciAppsTolerationValue}
      effect: NoSchedule
  CasC:
    Enabled: true
    Retriever:
      Enabled: true
      # ROOT CAUSE (see tickets/Secondary_Findings_Product_Bugs.md finding
      # #6): this Helm-chart-native OC bundle retriever was hardcoded to
      # upstream cloudbees/terraform-aws-cloudbees-ci-eks-addon.git@develop
      # -- a completely separate mechanism from oc/jcasc.main.yaml's own
      # hand-authored bundleStorageService block (which correctly points at
      # our fork via the cascRepo/cascBranch CasC variables). With this one
      # left pointed at upstream, Jenkins logged repeated
      # "Found unresolved variable 'cbci_casc_repo_url'"/'cbci_casc_branch'
      # warnings and "Error while checking out remote casc-mm-store" /
      # "Bundle path does not exist: /mc-none-ha" -- i.e. this stale/wrong
      # retriever registration appears to have been corrupting or
      # conflicting with the real one, which is why managed controllers
      # never received any plugins/items/rbac content no matter what was
      # changed in the bundle itself. Point this at our fork/branch too.
      scmRepo: "https://github.com/holywen/terraform-aws-cloudbees-ci-eks-addon.git"
      scmBranch: keysight-casc-test
      scmBundlePath: blueprints/02-at-scale/cbci/casc/oc
      scmPollingInterval: PT20M
Persistence:
  StorageClass: efs
Hibernation:
  Enabled: true
  NodeSelector:
    role: ${cbciAppsNodeRole}
  Tolerations:
    - key: ${cbciAppsTolerationKey}
      operator: Equal
      value: ${cbciAppsTolerationValue}
      effect: NoSchedule
Agents:
  SeparateNamespace:
    Enabled: true
    Create: true
    Name: ${cbciAgentsNamespace}
