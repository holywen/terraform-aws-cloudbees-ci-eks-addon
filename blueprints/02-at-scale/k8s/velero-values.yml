nodeSelector:
  kubernetes.io/os: linux

kubectl:
  image:
    # Issue #60's original pin (bitnami/kubectl:1.26.14-debian-11-r6) is
    # unusable now: Bitnami's 2025 registry policy change removed nearly all
    # historical version tags from the free tier. Two replacements were
    # tried and rejected: bitnami/kubectl:latest pulls fine but is a
    # different, incompatible base image (missing libreadline.so.8);
    # registry.k8s.io/kubectl (upstream velero chart's current default) is
    # a minimal image with no shell at all, and this chart version's job
    # script needs one ("/bin/sh": no such file or directory). Bitnami
    # mirrors the exact pre-migration image, byte-for-byte, under the
    # "bitnamilegacy" org for free -- confirmed working (has a shell,
    # correct kubectl version) via a throwaway pod before committing.
    registry: docker.io
    repository: bitnamilegacy/kubectl
    tag: 1.26.14-debian-11-r6
