nodeSelector:
  kubernetes.io/os: linux

kubectl:
  image:
    # Issue #60's original pin (bitnami/kubectl:1.26.14-debian-11-r6) is
    # unusable now: Bitnami's 2025 registry policy change removed nearly all
    # historical version tags from the free tier, and their "latest" tag is
    # a different, incompatible base image (missing libreadline.so.8). The
    # upstream velero chart's own current default has since moved away from
    # bitnami/kubectl entirely, defaulting to the official image instead --
    # matching that here rather than fighting Bitnami's registry changes.
    repository: registry.k8s.io/kubectl
    # Chart's auto-derived tag (from KubeVersion) truncates to "1.32" (no
    # "v", no patch), which registry.k8s.io doesn't publish -- real tags
    # are "v1.32.13"-style. Pin explicitly to the cluster's actual version.
    tag: v1.32.13
