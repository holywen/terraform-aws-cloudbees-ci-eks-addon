removeStrategy:
  rbac: SYNC
# TEST 2026-09-28, user-corrected methodology: mc-parent/rbac.yaml is SHARED
# by every managed controller in this testbed -- editing it (as an earlier
# attempt this session did) puts the same grant on team-a AND team-b
# identically, which can never distinguish "team-a's grant reaching team-b's
# separate JVM" from "team-b independently has the same grant via the shared
# template." This bundle is layered ONLY on top of team-a's own
# configurationAsCode assignment (oc/items.root.yaml), parented on mc-parent
# but with its OWN rbac.yaml -- team-b stays on the unmodified mc-none-ha
# bundle and has NONE of this content at all. Any cross-controller HTTP
# result now has a clean interpretation: if mc-actor-sa can't even
# authenticate against team-b (401), that's proof team-b's separate JVM has
# no knowledge of this identity at all -- a genuine, structural absence of
# reach, not a permission check that happens to fail.
roles:
- filterable: false
  permissions:
  - hudson.model.Hudson.Read
  - hudson.model.Item.Read
  - hudson.model.Item.Discover
  - nectar.plugins.rbac.groups.Group.Manage
  - nectar.plugins.rbac.groups.Group.CreateToken
  name: mc-sa-token-manager
serviceAccounts:
- name: mc-actor-sa
  authentication:
  - type: password
    id: mc-actor-sa-token
    description: "cross-controller reach test actor, team-a ONLY"
    password: cloudbees_ci_sa_mc28actor19test07a4b1c2d3e4f5061728
- name: mc-target-sa
  authentication: []
groups:
- members:
    serviceAccounts:
    - mc-actor-sa
  roles:
  - name: mc-sa-token-manager
    grantedAt: current
  name: mc-token-managers
