# Local rbac.yaml for the mc-ha bundle (2026-09-29). mc-ha has `parent: mc-parent`
# (bundle.yaml), so this file is MERGED with mc-parent's own rbac.yaml on every
# controller using mc-ha -- not a replacement of it. `removeStrategy:` is required
# on EVERY rbac.yaml fragment being merged (confirmed live: omitting it here, even
# though mc-parent's own rbac.yaml already declares one, hard-fails CasC boot with
# `CasCException: remove strategy is required` -- each merged fragment needs its own).
removeStrategy:
  rbac: SYNC
# serviceAccountOidcIssuerDomains MUST be repeated in every merged rbac.yaml
# fragment, not just the parent's -- confirmed live on mc-none-ha's sibling bundle
# (2026-09-29): with a bundle-local rbac.yaml added (removeStrategy: SYNC, applied
# AFTER mc-parent's fragment in the merge order), the allow-list set by mc-parent's
# fragment got silently RESET to empty by this later fragment not re-declaring it --
# breaking every Entra OIDC-authenticated service account fleet-wide (401,
# previously-working tokens rejected) until it was added there too. This is NOT
# additive/unioned merge behavior for this particular key -- unlike
# roles:/serviceAccounts:/groups:, which do merge additively across fragments by
# name, this single list-valued key is last-fragment-wins. Applied here
# preemptively for consistency, since mc-ha would hit the identical issue the
# moment a controller actually uses it. See Secondary_Findings_Product_Bugs.md
# finding #22.
serviceAccountOidcIssuerDomains:
  - amazonaws.com
  - login.microsoftonline.com
# The "Admins" role referenced below is defined in mc-parent/rbac.yaml (Keysight AAA
# R1); since parent-bundle inheritance merges into one effective, controller-local
# RBAC config (confirmed via each controller's own consolidated
# core-casc-bundle/rbac/*.yaml), granting that role here works the same as if it
# were defined directly in this file -- this is NOT the OC-central-role-resolution
# mechanism (D1 F3), it's simple same-database local merge, so it does not depend on
# securitySettingsEnforcement.global at all.
#
# CHANGED 2026-09-29, per user request: this local admin is now a REAL HUMAN Entra
# ID identity via SSO, not a CBCI Service Account -- mc-parent's own jcasc.security.yaml
# sets `securityRealm: "operationsCenter"` on every managed controller, so human
# login here is relayed from the OC's own oic-auth (Entra ID) realm, exactly the
# mechanism already proven end-to-end in Test3_Results_EndUser_OIDC_EntraID.md
# (direct `members.users` grant, and separately `groupsFieldName`->`external_groups`
# claim mapping -- both confirmed working, including via SSO relay to a managed
# controller). `holywen@hotmail.com` is the same real, already-tested Entra identity
# Test 3 used for that exact relay confirmation. Distinct from mc-parent's own
# admins-sa/admins-oidc-sa (still CBCI Service Accounts) -- this is a SEPARATE local
# admin GRANT to a human identity, existing only on mc-ha bundle controllers, not
# the shared R1 role-based service accounts.
groups:
- members:
    users:
    - holywen@hotmail.com
  roles:
  - name: "Admins"
    grantedAt: current
  name: mc-ha-admin-users

