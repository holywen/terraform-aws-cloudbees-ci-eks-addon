# Local rbac.yaml for the mc-ha bundle (2026-09-29). mc-ha has `parent: mc-parent`
# (bundle.yaml), so this file is MERGED with mc-parent's own rbac.yaml on every
# controller using mc-ha -- not a replacement of it. `removeStrategy:` is required
# on EVERY rbac.yaml fragment being merged (confirmed live: omitting it here, even
# though mc-parent's own rbac.yaml already declares one, hard-fails CasC boot with
# `CasCException: remove strategy is required` -- each merged fragment needs its own).
removeStrategy:
  rbac: SYNC
# serviceAccountOidcIssuerDomains MUST be repeated in every merged rbac.yaml
# fragment, not just the parent's -- confirmed live on mc-none-ha's sibling bundle
# (2026-09-29): with a bundle-local rbac.yaml added (removeStrategy: SYNC, applied
# AFTER mc-parent's fragment in the merge order), the allow-list set by mc-parent's
# fragment got silently RESET to empty by this later fragment not re-declaring it --
# breaking every Entra OIDC-authenticated service account fleet-wide (401,
# previously-working tokens rejected) until it was added there too. This is NOT
# additive/unioned merge behavior for this particular key -- unlike
# roles:/serviceAccounts:/groups:, which do merge additively across fragments by
# name, this single list-valued key is last-fragment-wins. Applied here
# preemptively for consistency, since mc-ha would hit the identical issue the
# moment a controller actually uses it. See Secondary_Findings_Product_Bugs.md
# finding #22.
serviceAccountOidcIssuerDomains:
  - amazonaws.com
  - login.microsoftonline.com
# Four NEW OIDC service accounts, team-a-only (2026-09-29, per user request) --
# distinct Azure AD app registrations from mc-none-ha's (team-b's) *-oidc-sa
# accounts, same self-referential client-credentials pattern (subject = own
# service-principal object ID, audience = own client ID), each with
# requestedAccessTokenVersion=2 set so the token's issuer matches this
# environment's configured v2.0 issuer. App registrations:
# cbci-keysight-teama-admins-sa / -power-users-sa / -developers-sa / -browsers-sa.
serviceAccounts:
- name: admins-oidc-sa
  authentication:
  - type: oidc
    id: teama-admins-oidc-entra
    issuer: "https://login.microsoftonline.com/97f9ccac-e200-42e0-b725-6e50e4d235b8/v2.0"
    subject: "841ace97-ce95-4046-a845-539695c82f3a"
    audience: "b35ff691-069a-44f4-addd-dec0d427b058"
- name: power-users-oidc-sa
  authentication:
  - type: oidc
    id: teama-power-users-oidc-entra
    issuer: "https://login.microsoftonline.com/97f9ccac-e200-42e0-b725-6e50e4d235b8/v2.0"
    subject: "ef780550-cc26-4c17-a2a8-b36a7ef2c494"
    audience: "7fa6f79b-f4d7-454f-acb4-1f26d0ae66b2"
- name: developers-oidc-sa
  authentication:
  - type: oidc
    id: teama-developers-oidc-entra
    issuer: "https://login.microsoftonline.com/97f9ccac-e200-42e0-b725-6e50e4d235b8/v2.0"
    subject: "57d4e0c9-4c3e-484d-af5d-be13ef6c9a4d"
    audience: "e85677d4-34c9-4885-9867-d622cc285305"
- name: browsers-oidc-sa
