jenkins:
  clouds:
  # Test: cap per controller per cloud enforced by a ResourceQuota on the cloud's own namespace.
  # containerCapStr is intentionally unset (plugin cap disabled). See agent-cap.tf.
  - kubernetes:
      name: "k8s-linux"
      namespace: "${agentNsLinux}"
      webSocket: true
      templates:
      - name: "cap-test"
        label: "cap-test"
        idleMinutes: 0
        slaveConnectTimeout: 120
        yaml: |-
          apiVersion: "v1"
          kind: "Pod"
          spec:
            containers:
            - name: "busybox"
              image: "busybox:1.37.0-musl"
              command: ["sleep"]
              args: ["99d"]
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
                limits:
                  memory: "512Mi"
            nodeSelector:
              role: "linux-builds"
              provisioner: "karpenter"
            tolerations:
            - effect: "NoSchedule"
              key: "dedicated"
              operator: "Equal"
              value: "build-linux"
  - kubernetes:
      name: "k8s-linux-xl"
      namespace: "${agentNsLinuxXl}"
      webSocket: true
      templates:
      - name: "cap-test-xl"
        label: "cap-test-xl"
        idleMinutes: 0
        slaveConnectTimeout: 120
        yaml: |-
          apiVersion: "v1"
          kind: "Pod"
          spec:
            containers:
            - name: "busybox"
              image: "busybox:1.37.0-musl"
              command: ["sleep"]
              args: ["99d"]
              resources:
                requests:
                  cpu: "1"
                  memory: "2Gi"
                limits:
                  memory: "2Gi"
            nodeSelector:
              role: "linux-builds"
              provisioner: "karpenter"
            tolerations:
            - effect: "NoSchedule"
              key: "dedicated"
              operator: "Equal"
              value: "build-linux"
