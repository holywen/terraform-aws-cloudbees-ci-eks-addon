# The "Admins" role referenced below is defined in mc-parent/rbac.yaml (Keysight AAA
# R1); since parent-bundle inheritance merges into one effective, controller-local
# RBAC config (confirmed via each controller's own consolidated
# core-casc-bundle/rbac/*.yaml), granting that role here works the same as if it
# were defined directly in this file -- this is NOT the OC-central-role-resolution
# mechanism (D1 F3), it's simple same-database local merge, so it does not depend on
# securitySettingsEnforcement.global at all.
#
# CHANGED 2026-09-29, per user request: this local admin is now a REAL HUMAN Entra
# ID identity via SSO, not a CBCI Service Account -- mc-parent's own jcasc.security.yaml
# sets `securityRealm: "operationsCenter"` on every managed controller, so human
# login here is relayed from the OC's own oic-auth (Entra ID) realm, exactly the
# mechanism already proven end-to-end in Test3_Results_EndUser_OIDC_EntraID.md
# (direct `members.users` grant, and separately `groupsFieldName`->`external_groups`
# claim mapping -- both confirmed working, including via SSO relay to a managed
# controller). `holywen@hotmail.com` is the same real, already-tested Entra identity
# Test 3 used for that exact relay confirmation. Distinct from mc-parent's own
# admins-sa/admins-oidc-sa (still CBCI Service Accounts) -- this is a SEPARATE local
# admin GRANT to a human identity, one independently-evaluated per controller using
# this bundle (team-a and team-b), not the shared R1 role-based service accounts.
groups:
- members:
    users:
    - holywen@hotmail.com
  roles:
  - name: "Admins"
    grantedAt: current
  name: mc-none-ha-admin-users
# User-requested (2026-09-29): controller-local administer grant for team-b's
# own admin. mc-none-ha is now team-b-only (team-a reassigned to mc-ha for
# genuine per-controller isolation), so this grant is exclusive to team-b.
- name: controller-team-b-admins
  members:
    users:
    - team-b-admin@444666.best
  roles:
  - name: administer
    grantedAt: current
# Groups for the four OIDC service accounts moved here from mc-parent above.
- members:
    serviceAccounts:
