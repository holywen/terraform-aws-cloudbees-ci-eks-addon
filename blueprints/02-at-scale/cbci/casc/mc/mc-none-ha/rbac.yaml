    id: power-users-oidc-entra
    issuer: "https://login.microsoftonline.com/97f9ccac-e200-42e0-b725-6e50e4d235b8/v2.0"
    subject: "0a9430a2-8b20-422e-9e33-20a243b59b58"
    audience: "76a998a6-b20b-4ac0-a5da-959e063a9537"
- name: developers-oidc-sa
