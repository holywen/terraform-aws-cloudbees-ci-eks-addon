# Local rbac.yaml for the mc-none-ha bundle (2026-09-29). mc-none-ha has
# `parent: mc-parent` (bundle.yaml), so this file is MERGED with mc-parent's own
# rbac.yaml on every controller using mc-none-ha (team-a, team-b in this
# environment) -- not a replacement of it. `removeStrategy:` is required on EVERY
# rbac.yaml fragment being merged (confirmed live: omitting it here, even though
# mc-parent's own rbac.yaml already declares one, hard-fails CasC boot with
# `CasCException: remove strategy is required` -- each merged fragment needs its own).
removeStrategy:
  rbac: SYNC
# serviceAccountOidcIssuerDomains MUST be repeated in every merged rbac.yaml
# fragment, not just the parent's -- confirmed live (2026-09-29): with this bundle's
# own rbac.yaml added (removeStrategy: SYNC, applied AFTER mc-parent's fragment in
# the merge order -- confirmed via this controller's own core-casc-bundle/bundle.yaml
# `rbac:` list), the allow-list set by mc-parent's fragment got silently RESET to
# empty by this later fragment not re-declaring it -- breaking every Entra
# OIDC-authenticated service account fleet-wide (401, previously-working tokens
# rejected) until this was added here too. This is NOT additive/unioned merge
# behavior for this particular key -- unlike roles:/serviceAccounts:/groups:, which
# do merge additively across fragments by name, this single list-valued key is
# last-fragment-wins. See Secondary_Findings_Product_Bugs.md finding #22.
serviceAccountOidcIssuerDomains:
  - amazonaws.com
  - login.microsoftonline.com
# Moved here 2026-09-29 from mc-parent/rbac.yaml, per user request: these four
# OIDC service accounts are now team-b-only (mc-none-ha is no longer shared
# with team-a, which moved to mc-ha), not centrally shared via mc-parent.
# Same real Entra ID app registrations as before the move -- credentials
# unchanged, only their CasC declaration location changed.
serviceAccounts:
- name: admins-oidc-sa
  authentication:
  - type: oidc
    id: admins-oidc-entra
    issuer: "https://login.microsoftonline.com/97f9ccac-e200-42e0-b725-6e50e4d235b8/v2.0"
    subject: "97abd13b-4a87-4857-bda7-6dc874ef078c"
    audience: "a883906a-ae3e-48df-8dda-fc605f5dc2a2"
- name: power-users-oidc-sa
  authentication:
