removeStrategy:
  rbac: SYNC
serviceAccountOidcIssuerDomains:
  - amazonaws.com
  - login.microsoftonline.com
roles:
- name: authenticated
- permissions:
  - hudson.model.Hudson.Administer
  - hudson.model.Hudson.Read
  - hudson.model.Item.Create
  - hudson.model.Item.Read
  - hudson.model.Item.Configure
  - hudson.model.Item.Delete
  - hudson.model.View.Read
  name: administer
- name: anonymous
- filterable: true
  permissions:
  - hudson.model.Item.Read
  - hudson.model.Item.Discover
  - hudson.model.Hudson.Read
  - hudson.model.View.Read
  name: browse
# TEST 2026-09-28, user-requested: standalone (no parent: mc-parent) bundle
# for team-a only, to rule out whether the CasC parent-bundle inheritance
# mechanism itself is what triggers finding #17, as distinct from "any
# bundle used by exactly one controller."
- filterable: false
  permissions:
  - hudson.model.Hudson.Read
  - hudson.model.Item.Read
  - hudson.model.Item.Discover
  - nectar.plugins.rbac.groups.Group.Manage
  - nectar.plugins.rbac.groups.Group.CreateToken
  name: teamA-standalone-token-manager
serviceAccounts:
- name: teamA-standalone-actor-sa
  authentication:
  - type: password
    id: teamA-standalone-actor-token
    description: "exists ONLY on team-a's standalone bundle, never on team-b"
    password: cloudbees_ci_sa_11223344556677889900aabbccddeeff
- name: teamA-standalone-target-sa
  authentication: []
groups:
- members:
    external_groups:
    - CI_Admins
  roles:
  - name: administer
    grantedAt: current
  name: Administrators
- members:
    external_groups:
    - Dev_Team_X
    - Dev_Team_Y
  roles:
  - name: browse
    grantedAt: current
    propagates: false
  name: Browsers
- members:
    serviceAccounts:
    - teamA-standalone-actor-sa
  roles:
  - name: teamA-standalone-token-manager
    grantedAt: current
  name: teamA-standalone-token-managers-group
