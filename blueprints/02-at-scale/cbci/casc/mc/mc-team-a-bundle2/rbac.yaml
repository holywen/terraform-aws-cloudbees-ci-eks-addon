removeStrategy:
  rbac: SYNC
serviceAccountOidcIssuerDomains:
  - amazonaws.com
  - login.microsoftonline.com
roles:
- name: authenticated
- permissions:
  - hudson.model.Hudson.Administer
  - hudson.model.Hudson.Read
  - hudson.model.Item.Create
  - hudson.model.Item.Read
  - hudson.model.Item.Configure
  - hudson.model.Item.Delete
  - hudson.model.View.Read
  name: administer
- name: anonymous
- filterable: true
  permissions:
  - hudson.model.Item.Read
  - hudson.model.Item.Discover
  - hudson.model.Hudson.Read
  - hudson.model.View.Read
  name: browse
# TEST 1 REDESIGN (2026-09-28, user-requested): "SSO + RBAC" vs "SSO only"
# comparison. teamA-sa is a ROOT-scoped service account defined directly in
# THIS controller's own standalone bundle, with a LOCALLY-defined role
# granting Group.CreateToken -- per Test5_Results_SecurityEnforcement_OptOut.md
# Follow-up #7's established rule, a root-scoped SA only gets real
# permissions from a role defined LOCALLY on that controller, so this role
# is deliberately NOT shared/centralized.
- filterable: false
  permissions:
  - hudson.model.Hudson.Read
  - hudson.model.Item.Read
  - hudson.model.Item.Discover
  - nectar.plugins.rbac.groups.Group.Manage
  - nectar.plugins.rbac.groups.Group.CreateToken
  name: teamA-sa-token-manager
serviceAccounts:
- name: teamA-sa
  authentication:
  - type: password
    id: teamA-sa-token
    description: "root-scoped on team-a's own standalone bundle; exists ONLY on team-a"
    password: cloudbees_ci_sa_d536fb274c77a9a732941f60a85a5dfb
- name: teamA-target-sa
  authentication: []
groups:
- members:
    external_groups:
    - CI_Admins
  roles:
  - name: administer
    grantedAt: current
  name: Administrators
- members:
    external_groups:
    - Dev_Team_X
    - Dev_Team_Y
  roles:
  - name: browse
    grantedAt: current
    propagates: false
  name: Browsers
- members:
    serviceAccounts:
    - teamA-sa
  roles:
  - name: teamA-sa-token-manager
    grantedAt: current
  name: teamA-token-managers
