removeStrategy:
  rbac: SYNC
  items: NONE
items:
- kind: folder
  name: Squad_X
  displayName: Squad_X
  # K8s ServiceAccount (EKS OIDC) evaluation, Test 4: a folder-scoped service
  # account identity authenticated via the EKS cluster's own OIDC issuer (no
  # AWS IAM/IRSA involved -- the cluster's issuer is a standalone
  # spec-compliant OIDC IdP). No explicit `audience` is set, matching
  # CloudBees's own documented example (it defaults to the service account
  # URL). The issuer allow-list (serviceAccountOidcIssuerDomains) lives only
  # in oc/rbac.yaml -- see that file for why.
  # Issuer path updated 2026-09-24 -- this is a fresh cluster (cbci-bp02-ksight)
  # from a full teardown+redeploy earlier this session; the OIDC issuer's
  # cluster-unique ID path changes on every new cluster. Re-check with
  # `kubectl get --raw /.well-known/openid-configuration | jq .issuer` before
  # reusing this file against a different cluster.
  serviceAccounts:
  - name: eks-oidc-sa
    authentication:
    - type: oidc
      id: eks-oidc-cbci-bp02-ksight
      issuer: "https://oidc.eks.us-west-2.amazonaws.com/id/7FB741C08C697CC22D9631DFCC3B71C8"
      subject: "system:serviceaccount:cbci-sa-test:eks-oidc-sa"
  groups:
  - members:
      external_groups:
      - Dev_Team_X
    roles:
    - name: develop
      grantedAt: current
    name: Squad_X
  - members:
      serviceAccounts:
      - Squad_X/eks-oidc-sa
    roles:
    # Reverted 2026-09-25 back to `develop` after Follow-up #7's clean re-test
    # (see Test5_Results_SecurityEnforcement_OptOut.md): confirmed folder-scoped SA
    # + centrally-defined-only role resolves correctly under BOTH realmOnly and
    # realmAndAuthorization -- mode is not the controlling variable, item/folder
    # scope is. This is the mechanism the corrected D2 recommendation now relies on.
    - name: develop
      grantedAt: current
    name: eks-oidc-squad-x-bot

