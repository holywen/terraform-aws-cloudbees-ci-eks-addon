# EXPERIMENT 2026-09-24 (Test Case 1, per user-supplied rule): under "sso+rbac"
# (realmAndAuthorization) enforcement, ROLE DEFINITIONS are supposed to be central
# (sourced from the OC), while GROUPS (which map external identities/service accounts
# to those role names) are configured locally, per controller. Testing this directly:
# this file defines NO local `roles:` list at all -- only a `groups:` mapping that
# references role names owned solely by the OC's own rbac.yaml (oc-enforcement-marker-role,
# which exists ONLY there -- see Test5_Results_SecurityEnforcement_OptOut.md /
# Secondary_Findings_Product_Bugs.md #13/#14 for the marker-role technique and the
# earlier, now-superseded "whole rbac.yaml missing" test). If roles really are centrally
# sourced, admin_cbci_a (mapped here via the CI_Admins external group) should end up
# granted oc-enforcement-marker-role's actual permission set on this controller, despite
# this file never defining that role itself.
# Revert-ready: restored from /tmp/mc-parent-rbac-backup.yaml.
removeStrategy:
  rbac: SYNC
groups:
- members:
    external_groups:
    - CI_Admins
  roles:
  - name: oc-enforcement-marker-role
    grantedAt: current
  name: Administrators
- members:
    external_groups:
    - Dev_Team_X
    - Dev_Team_Y
  roles:
  - name: browse
    grantedAt: current
    propagates: false
  name: Browsers
