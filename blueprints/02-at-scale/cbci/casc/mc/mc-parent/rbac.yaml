removeStrategy:
  rbac: SYNC
# FIX confirmed 2026-09-25 (no longer an experiment -- keeping this as the permanent
# baseline): serviceAccountOidcIssuerDomains, declared directly in a MANAGED
# CONTROLLER's own rbac.yaml (mc-parent, shared by team-a/team-b), is now accepted with
# no schema-validation error on CBCI 2.568.3.37913 -- this used to be documented as
# OC-only, causing a cascading bundle-validation failure (Secondary_Findings_Product_Bugs.md
# finding #8) when placed here. Retested directly rather than assuming the old finding
# still held (schema introspection alone wasn't conclusive -- the property is absent
# from a managed controller's own /configuration-as-code/schema, yet is accepted and
# applied anyway). Confirmed functionally: the local OIDC issuer allow-list is
# populated from this CasC value, survives a full pod restart with no manual Script
# Console step (previously required -- finding #9/Gap B, finding #12), and a real
# live-issued OIDC JWT authenticates successfully immediately after a restart with no
# intervention. See findings #8/#9/#12's 2026-09-25 updates for the full retest.
# Re-verify this on whichever exact CBCI version Keysight ultimately deploys -- this is
# exactly the kind of narrow behavior that can regress between chart versions.
serviceAccountOidcIssuerDomains:
  - amazonaws.com
  - login.microsoftonline.com
# EXPERIMENT 2026-09-24, user-requested: testing doc 2's stated premise ("controllers
# that inherit their authorization strategy from the operations center cannot define
# root-scoped service accounts") directly. Both team-a and team-b are currently at
# "Use global security enforcement" (realmAndAuthorization, fully OC-inherited -- the
# earlier opt-out on team-a was lost somewhere across this session's many cjoc/item
# restarts, itself worth a follow-up note). This adds a ROOT-scoped serviceAccount
# (not inside a folder item, unlike Test 4's Squad_X/eks-oidc-sa) to see whether CasC
# rejects it outright while both controllers inherit OC authorization. Revert-ready:
# delete this serviceAccounts:/groups: block after the test.
serviceAccounts:
- name: root-scope-test-sa
  authentication:
  - type: oidc
    id: root-scope-test-cbci-bp02-ksight
    issuer: "https://oidc.eks.us-west-2.amazonaws.com/id/7FB741C08C697CC22D9631DFCC3B71C8"
    subject: "system:serviceaccount:cbci-sa-test:root-scope-test-sa"
