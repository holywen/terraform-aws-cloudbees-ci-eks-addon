groups:
- members:
    external_groups:
    - CI_Admins
  roles:
  - name: administer
    grantedAt: current
  name: Administrators
- members:
    external_groups:
    - Dev_Team_X
    - Dev_Team_Y
  roles:
  - name: browse
    grantedAt: current
    propagates: false
  name: Browsers
- members:
    serviceAccounts:
    - root-scope-test-sa
  roles:
  # Reverted 2026-09-25 to `browse` (locally defined here) after Follow-up #7
  # (Test5_Results_SecurityEnforcement_OptOut.md) established the real, complete
  # finding: root-scoped service accounts CANNOT resolve a centrally-defined-only
  # (OC-inherited) role under EITHER realmOnly or realmAndAuthorization -- this is
  # unrelated to the enforcement mode (confirmed matrix: folder-scoped SAs resolve
  # centrally-defined roles fine under both modes; root-scoped SAs fail under both).
  # A root-scoped SA only gets real permissions from a role defined LOCALLY on this
  # controller, which is why `browse` (defined above) works here.
  - name: browse
    grantedAt: current
  name: root-scope-test-group
# Keysight AAA R1 (2026-09-29): one group per role, each granting that role to its
# password-authenticated and OIDC-authenticated service account pair. Named distinctly
# from the pre-existing "Administrators"/"Browsers" external-group-linked groups above
# to avoid a group-name collision -- those two grant the (lowercase) administer/browse
# roles to LDAP/Entra external groups; these four grant the new (capitalized) R1 role
# names to this activity's service accounts specifically.
- members:
    serviceAccounts:
    - admins-sa
    - admins-oidc-sa
  roles:
  - name: "Admins"
    grantedAt: current
  name: admins-service-accounts
- members:
    serviceAccounts:
    - power-users-sa
    - power-users-oidc-sa
  roles:
  - name: "Power Users"
    grantedAt: current
  name: power-users-service-accounts
- members:
    serviceAccounts:
    - developers-sa
    - developers-oidc-sa
  roles:
  - name: "Developers"
    grantedAt: current
  name: developers-service-accounts
- members:
    serviceAccounts:
    - browsers-sa
    - browsers-oidc-sa
  roles:
  - name: "Browsers"
    grantedAt: current
  name: browsers-service-accounts

