groups:
- members:
    external_groups:
    - CI_Admins
  roles:
  - name: administer
    grantedAt: current
  name: Administrators
- members:
    external_groups:
    - Dev_Team_X
    - Dev_Team_Y
  roles:
  - name: browse
    grantedAt: current
    propagates: false
  name: Browsers
- members:
    serviceAccounts:
    - root-scope-test-sa
  roles:
  # Reverted 2026-09-25 to `browse` (locally defined here) after Follow-up #7
  # (Test5_Results_SecurityEnforcement_OptOut.md) established the real, complete
  # finding: root-scoped service accounts CANNOT resolve a centrally-defined-only
  # (OC-inherited) role under EITHER realmOnly or realmAndAuthorization -- this is
  # unrelated to the enforcement mode (confirmed matrix: folder-scoped SAs resolve
  # centrally-defined roles fine under both modes; root-scoped SAs fail under both).
  # A root-scoped SA only gets real permissions from a role defined LOCALLY on this
  # controller, which is why `browse` (defined above) works here.
  - name: browse
    grantedAt: current
  name: root-scope-test-group

