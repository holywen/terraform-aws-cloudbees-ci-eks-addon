removeStrategy:
  rbac: SYNC
# FIX confirmed 2026-09-25 (no longer an experiment -- keeping this as the permanent
# baseline): serviceAccountOidcIssuerDomains, declared directly in a MANAGED
# CONTROLLER's own rbac.yaml (mc-parent, shared by team-a/team-b), is now accepted with
# no schema-validation error on CBCI 2.568.3.37913 -- this used to be documented as
# OC-only, causing a cascading bundle-validation failure (Secondary_Findings_Product_Bugs.md
# finding #8) when placed here. Retested directly rather than assuming the old finding
# still held (schema introspection alone wasn't conclusive -- the property is absent
# from a managed controller's own /configuration-as-code/schema, yet is accepted and
# applied anyway). Confirmed functionally: the local OIDC issuer allow-list is
# populated from this CasC value, survives a full pod restart with no manual Script
# Console step (previously required -- finding #9/Gap B, finding #12), and a real
# live-issued OIDC JWT authenticates successfully immediately after a restart with no
# intervention. See findings #8/#9/#12's 2026-09-25 updates for the full retest.
# Re-verify this on whichever exact CBCI version Keysight ultimately deploys -- this is
# exactly the kind of narrow behavior that can regress between chart versions.
serviceAccountOidcIssuerDomains:
  - amazonaws.com
  - login.microsoftonline.com
# EXPERIMENT 2026-09-24, user-requested: testing doc 2's stated premise ("controllers
# that inherit their authorization strategy from the operations center cannot define
# root-scoped service accounts") directly. Both team-a and team-b are currently at
# "Use global security enforcement" (realmAndAuthorization, fully OC-inherited -- the
# earlier opt-out on team-a was lost somewhere across this session's many cjoc/item
# restarts, itself worth a follow-up note). This adds a ROOT-scoped serviceAccount
# (not inside a folder item, unlike Test 4's Squad_X/eks-oidc-sa) to see whether CasC
# rejects it outright while both controllers inherit OC authorization. Revert-ready:
# delete this serviceAccounts:/groups: block after the test.
serviceAccounts:
- name: root-scope-test-sa
  authentication:
  - type: oidc
    id: root-scope-test-cbci-bp02-ksight
    issuer: "https://oidc.eks.us-west-2.amazonaws.com/id/7FB741C08C697CC22D9631DFCC3B71C8"
    subject: "system:serviceaccount:cbci-sa-test:root-scope-test-sa"
# Keysight AAA R1 (2026-09-29): four roles/groups (Admins, Power Users, Developers,
# Browsers), each with one password-authenticated SA and one OIDC-authenticated SA --
# per D1/D2's "one service account per role" pattern. Root-scoped, defined directly in
# this shared mc-parent template: per Test5_Results_SecurityEnforcement_OptOut.md
# Follow-up #7/#9 and Secondary_Findings_Product_Bugs.md finding #13, a root-scoped SA
# only gets real permissions from a role DEFINED LOCALLY on that controller -- since
# the four roles below are defined locally, right here in the shared template, this
# works. Per the Customer Guide's shared-template caveat, each controller inheriting
# mc-parent provisions its own independently-evaluated copy of these SAs/roles/groups
# -- this is centralized authoring with per-controller local evaluation, not one shared
# identity reachable across controllers (confirmed: Test1_Results_Ticket_277627_CreateToken_Scoping.md).
#
# The four *-oidc-sa entries use Entra ID (this environment's confirmed human-login IdP,
# per D1's recommendation), NOT the EKS OIDC issuer used elsewhere in this file for
# K8s-ServiceAccount-based testing -- each is backed by its own real, dedicated Azure AD
# app registration (tenant 97f9ccac-e200-42e0-b725-6e50e4d235b8), created specifically
# for this test, following the exact self-referential client-credentials pattern already
# proven working for entra-oidc-sa (oc/rbac.yaml, items.squad_y-folder.yaml): `subject`
# is the app's own service-principal object ID, `audience` is the app's own client
# (appId), and the app requests a token scoped to its own `<appId>/.default` --
# confirmed live via a real client-credentials token exchange, decoded, before wiring
# in below (iss/sub/aud/ver all matched). App registrations: cbci-keysight-admins-sa /
# -power-users-sa / -developers-sa / -browsers-sa. Client secrets exist in Azure (1-year
# expiry) for live testing but are not stored in this repo.
- name: admins-sa
  # `password:` value REMOVED 2026-09-29 per user request, `type: password` entry
  # kept (same id, so this is "the same token, no value asserted" rather than a
  # brand-new one). Per CloudBees's docs, `password` is "optional for existing
  # tokens; required for new ones" -- CAUTION, confirmed live: on the FIRST
  # redeploy after this change, the previous password kept working (200) because
  # the managed controller's own pod restarted before the OC had finished
  # propagating the updated bundle down to it -- a live-verified instance of the
  # CasC-hot-reload timing race (Secondary_Findings_Product_Bugs.md finding #1).
  # A second, later restart of the SAME pod (no further CasC change) then genuinely
  # picked up the change. Don't trust the very first post-change restart as
  # conclusive -- re-check after a short wait, or restart the controller a second
  # time, before drawing a conclusion.
  authentication:
  - type: password
    id: admins-sa-token
    description: "Password-authenticated service account for the Admins role."
- name: admins-oidc-sa
  authentication:
  - type: oidc
    id: admins-oidc-entra
    issuer: "https://login.microsoftonline.com/97f9ccac-e200-42e0-b725-6e50e4d235b8/v2.0"
    subject: "97abd13b-4a87-4857-bda7-6dc874ef078c"
    audience: "a883906a-ae3e-48df-8dda-fc605f5dc2a2"
- name: power-users-sa
  # See admins-sa's comment above -- `password:` value removed 2026-09-29.
  authentication:
  - type: password
    id: power-users-sa-token
    description: "Password-authenticated service account for the Power Users role."
- name: power-users-oidc-sa
  authentication:
  - type: oidc
    id: power-users-oidc-entra
    issuer: "https://login.microsoftonline.com/97f9ccac-e200-42e0-b725-6e50e4d235b8/v2.0"
    subject: "0a9430a2-8b20-422e-9e33-20a243b59b58"
    audience: "76a998a6-b20b-4ac0-a5da-959e063a9537"
- name: developers-sa
  # See admins-sa's comment above -- `password:` value removed 2026-09-29.
  authentication:
  - type: password
    id: developers-sa-token
    description: "Password-authenticated service account for the Developers role."
- name: developers-oidc-sa
  authentication:
  - type: oidc
    id: developers-oidc-entra
    issuer: "https://login.microsoftonline.com/97f9ccac-e200-42e0-b725-6e50e4d235b8/v2.0"
    subject: "7dc13da2-e491-4c13-8487-f04d473f13d9"
    audience: "d9c9728b-f3c5-4229-8ae7-91a9f3b25dcd"
- name: browsers-sa
  # See admins-sa's comment above -- `password:` value removed 2026-09-29.
  authentication:
  - type: password
    id: browsers-sa-token
    description: "Password-authenticated service account for the Browsers role."
- name: browsers-oidc-sa
  authentication:
  - type: oidc
    id: browsers-oidc-entra
    issuer: "https://login.microsoftonline.com/97f9ccac-e200-42e0-b725-6e50e4d235b8/v2.0"
    subject: "218285ad-ec00-4e67-adb4-3069d4f376d4"
    audience: "6d6280f3-bc12-45ba-98f6-3e971f79f98a"
