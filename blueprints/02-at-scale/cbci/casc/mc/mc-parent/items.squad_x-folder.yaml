removeStrategy:
  rbac: SYNC
  items: NONE
items:
- kind: folder
  name: Squad_X
  displayName: Squad_X
  # K8s ServiceAccount (EKS OIDC) evaluation, Test 4: a folder-scoped service
  # account identity authenticated via the EKS cluster's own OIDC issuer (no
  # AWS IAM/IRSA involved -- the cluster's issuer is a standalone
  # spec-compliant OIDC IdP). No explicit `audience` is set, matching
  # CloudBees's own documented example (it defaults to the service account
  # URL). The issuer allow-list (serviceAccountOidcIssuerDomains) lives only
  # in oc/rbac.yaml -- see that file for why.
  serviceAccounts:
  - name: eks-oidc-sa
    authentication:
    - type: oidc
      id: eks-oidc-cbci-bp02-ksight
      issuer: "https://oidc.eks.us-west-2.amazonaws.com/id/025702CE033D35FA8F67E6D3984F0ACF"
      subject: "system:serviceaccount:cbci-sa-test:eks-oidc-sa"
  groups:
  - members:
      external_groups:
      - Dev_Team_X
    roles:
    - name: develop
      grantedAt: current
    name: Squad_X
  - members:
      serviceAccounts:
      - Squad_X/eks-oidc-sa
    roles:
    - name: develop
      grantedAt: current
    name: eks-oidc-squad-x-bot

