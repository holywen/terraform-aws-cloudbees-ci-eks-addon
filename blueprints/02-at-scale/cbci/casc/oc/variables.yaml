variables:
  - message: "Welcome to the CloudBees CI blueprint add-on: At scale!"
  # Point at our fork/branch so the mc-parent/mc-none-ha/mc-ha controller
  # bundles (with our CasC edits) are actually used -- upstream/develop
  # would otherwise be used instead, and our edits under cbci/casc/mc/
  # would never be picked up.
  - cascRepo: "https://github.com/holywen/terraform-aws-cloudbees-ci-eks-addon.git"
  - cascBranch: keysight-casc-test
  - cascPathController: "/blueprints/02-at-scale/cbci/casc/mc/"
  - ldapManagerDN: "cn=admin,dc=acme,dc=org"
  - ldapRootDN: "dc=acme,dc=org"
  - ldapServer: "openldap-stack.auth.svc.cluster.local"
  - ldapUserSearch: "cn={0}"
  - vault_url: "http://vault.vault.svc.cluster.local:8200"
  - cascSecretsName: "cbci-sec-casc"
  - s3bucketPreffix: "cbci"
