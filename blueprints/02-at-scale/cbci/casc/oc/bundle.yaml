apiVersion: "2"
id: "oc"
version: "37"
jcasc:
  - jcasc.main.yaml
  - jcasc.security.yaml
  # Enforcement mode -- a fixed filename, its CONTENT is swapped by copying
  # from ../oc-jcasc-security-modes/{realmOnly,realmAndAuthorization}.yaml.
  # Do NOT reference the two variants directly here -- CloudBees's bundle
  # validator rejects the whole bundle if a file sits in this folder
  # unreferenced, so only ever one enforcement-mode file may live in oc/ at
  # a time. See jcasc.security-mode.yaml's own header for the switch steps.
  - jcasc.security-mode.yaml
  - jcasc.k8s-agents.yaml
  - jcasc.support.yaml
items:
  - items.admin-folder.yaml
  - items.root.yaml
plugins:
  - plugins.yaml
rbac:
  - rbac.yaml
variables:
  - variables.yaml
