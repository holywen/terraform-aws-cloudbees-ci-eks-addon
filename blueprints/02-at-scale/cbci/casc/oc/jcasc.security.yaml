# Base jcasc.security.yaml -- NON-enforcement-mode content only (security realm,
# authorization strategy, remoting security, vault credentials config). The
# `securitySettingsEnforcement.global` mode itself lives in one of the two
# switchable files below (jcasc.security-mode.realmOnly.yaml /
# jcasc.security-mode.realmAndAuthorization.yaml) -- to change mode, edit
# bundle.yaml's `jcasc:` list to reference the other file, bump the version,
# and redeploy. No need to hand-edit the enforcement block itself anymore
# (avoids the risk of a typo mid-test, and keeps both variants pre-validated
# and permanently available side by side). See
# Test1_Results_Ticket_277627_CreateToken_Scoping.md and
# Test5_Results_SecurityEnforcement_OptOut.md for the history behind this split.
jenkins:
  securityRealm:
    ldap:
      configurations:
      - managerDN: ${ldapManagerDN}
        managerPasswordSecret: ${sec_globalPassword}
        rootDN: ${ldapRootDN}
        server: ${ldapServer}
        userSearch: ${ldapUserSearch}
  authorizationStrategy: "cloudBeesRoleBasedAccessControl"
  remotingSecurity:
    enabled: true
  # excludeClientIPFromCrumb was removed from hudson.security.csrf.DefaultCrumbIssuer
  # in the newer Jenkins core shipped by CloudBees CI 2.568.2.37664 (this bundle
  # previously targeted 2.516.1.28669, pinned by a stale Terraform module default --
  # see main.k8s.tf). Its removal is a CSRF-hardening change upstream, not a
  # regression: dropping it just means crumbs are no longer weakened by excluding
  # the client IP, which is the safer default anyway. Leaving crumbIssuer unset
  # entirely (rather than an empty `standard: {}`) uses Jenkins' own default
  # crumb issuer.
globalCredentialsConfiguration:
  vaultGlobalConfiguration:
    authentications:
    - appRoleAuthentication:
        id: "cbci-oc"
        roleId: "REPLACE_ME"
        secretId: "REPLACE_ME"
    skipSslVerification: true
    url: "${vault_url}"
credentials:
  system:
  cloudbeesHashicorpVault:
    domainCredentials:
    - credentials:
      - vaultUsernamePassword:
          description: "cbci-oc/secret-a"
          id: "cbci-oc_secret-a"
          passwordKey: "password"
          usernameKey: "username"
          vaultSecretEngine:
            genericKV2SecretEngine:
              authenticationId: "cbci-oc"
              mountPath: "secret-v2"
              path: "cbci-oc/secret-a"
      - vaultSecretText:
          description: "cbci-oc/secret-b"
          id: "cbci-oc_secret-b"
          secretKey: "secret"
          vaultSecretEngine:
            genericKV2SecretEngine:
              authenticationId: "cbci-oc"
              mountPath: "secret-v2"
              path: "cbci-oc/secret-b"
