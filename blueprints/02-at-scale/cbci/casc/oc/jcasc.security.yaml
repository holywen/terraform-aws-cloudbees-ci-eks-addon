jenkins:
  securityRealm:
    # TEST 3 (Ticket #277728 follow-up): end-user OIDC login via Microsoft
    # Entra ID (oic-auth plugin), replacing the LDAP realm below to
    # empirically test CloudBees support's claim that end-user OIDC login
    # is "not officially supported ... a platform level limitation".
    # NOTE: securityRealm (authentication) and authorizationStrategy
    # (authorization) are orthogonal -- no RBAC changes needed for this swap.
    oic:
      clientId: "${entraEndUserClientId}"
      clientSecret: "${sec_entraEndUserClientSecret}"
      serverConfiguration:
        wellKnown:
          wellKnownOpenIDConfigurationUrl: "https://login.microsoftonline.com/${entraTenantId}/v2.0/.well-known/openid-configuration"
          scopesOverride: "openid profile email"
      userNameField: "preferred_username"
      fullNameFieldName: "name"
      emailFieldName: "email"
      logoutFromOpenidProvider: true
  # Original LDAP realm (Test 1/Test 2 baseline), preserved here in a
  # comment for a fast rollback if Test 3 needs to be reverted:
  #   ldap:
  #     configurations:
  #     - managerDN: ${ldapManagerDN}
  #       managerPasswordSecret: ${sec_globalPassword}
  #       rootDN: ${ldapRootDN}
  #       server: ${ldapServer}
  #       userSearch: ${ldapUserSearch}
  authorizationStrategy: "cloudBeesRoleBasedAccessControl"
  remotingSecurity:
    enabled: true
globalCredentialsConfiguration:
  vaultGlobalConfiguration:
    authentications:
    - appRoleAuthentication:
        id: "cbci-oc"
        roleId: "REPLACE_ME"
        secretId: "REPLACE_ME"
    skipSslVerification: true
    url: "${vault_url}"
credentials:
  system:
  cloudbeesHashicorpVault:
    domainCredentials:
    - credentials:
      - vaultUsernamePassword:
          description: "cbci-oc/secret-a"
          id: "cbci-oc_secret-a"
          passwordKey: "password"
          usernameKey: "username"
          vaultSecretEngine:
            genericKV2SecretEngine:
              authenticationId: "cbci-oc"
              mountPath: "secret-v2"
              path: "cbci-oc/secret-a"
      - vaultSecretText:
          description: "cbci-oc/secret-b"
          id: "cbci-oc_secret-b"
          secretKey: "secret"
          vaultSecretEngine:
            genericKV2SecretEngine:
              authenticationId: "cbci-oc"
              mountPath: "secret-v2"
              path: "cbci-oc/secret-b"
