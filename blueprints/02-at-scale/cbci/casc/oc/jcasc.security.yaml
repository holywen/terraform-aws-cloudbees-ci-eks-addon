# Testing "Allow client controllers to opt-out" (docs:
# https://docs.cloudbees.com/docs/cloudbees-ci/latest/secure/using-sso#configure-options-for-controllers).
# securitySettingsEnforcement.global picks ONE of realmAndAuthorization / realmOnly /
# noSecurityEnforcer -- confirmed live against this OC's own
# /configuration-as-code/schema (2026-09-24, chart 3.37914.0+c9bda104ea71).
#
# SWITCHED BACK to realmOnly 2026-09-24, same day, user-requested ("sso only"): the
# realmAndAuthorization test just showed root-scoped service accounts work fine on a
# managed controller even while it fully inherits OC authorization -- doc 2's stated
# premise ("controllers that inherit their authorization strategy from the operations
# center cannot define root-scoped service accounts") did NOT hold in this
# independent-CasC-bundle-per-controller architecture (see
# Test5_Results_SecurityEnforcement_OptOut.md, Follow-up #6). Testing realmOnly now
# anyway, per the user's explicit request, as the architecture actually intended for
# Keysight (R4): every controller authenticates via the OC's SSO realm, but defines its
# OWN complete rbac.yaml (roles + groups + serviceAccounts) with NO per-controller
# opt-out needed at all -- realmOnly never enforces authorization on anyone, by
# definition, so this should scale to 300+ controllers without a manual UI opt-out step
# per controller (unlike realmAndAuthorization + canOverride, finding #13's CasC gap).
security:
  securitySettingsEnforcement:
    global:
      realmOnly:
        canOverride: true
jenkins:
  securityRealm:
    ldap:
      configurations:
      - managerDN: ${ldapManagerDN}
        managerPasswordSecret: ${sec_globalPassword}
        rootDN: ${ldapRootDN}
        server: ${ldapServer}
        userSearch: ${ldapUserSearch}
  authorizationStrategy: "cloudBeesRoleBasedAccessControl"
  remotingSecurity:
    enabled: true
  # excludeClientIPFromCrumb was removed from hudson.security.csrf.DefaultCrumbIssuer
  # in the newer Jenkins core shipped by CloudBees CI 2.568.2.37664 (this bundle
  # previously targeted 2.516.1.28669, pinned by a stale Terraform module default --
  # see main.k8s.tf). Its removal is a CSRF-hardening change upstream, not a
  # regression: dropping it just means crumbs are no longer weakened by excluding
  # the client IP, which is the safer default anyway. Leaving crumbIssuer unset
  # entirely (rather than an empty `standard: {}`) uses Jenkins' own default
  # crumb issuer.
globalCredentialsConfiguration:
  vaultGlobalConfiguration:
    authentications:
    - appRoleAuthentication:
        id: "cbci-oc"
        roleId: "REPLACE_ME"
        secretId: "REPLACE_ME"
    skipSslVerification: true
    url: "${vault_url}"
credentials:
  system:
  cloudbeesHashicorpVault:
    domainCredentials:
    - credentials:
      - vaultUsernamePassword:
          description: "cbci-oc/secret-a"
          id: "cbci-oc_secret-a"
          passwordKey: "password"
          usernameKey: "username"
          vaultSecretEngine:
            genericKV2SecretEngine:
              authenticationId: "cbci-oc"
              mountPath: "secret-v2"
              path: "cbci-oc/secret-a"
      - vaultSecretText:
          description: "cbci-oc/secret-b"
          id: "cbci-oc_secret-b"
          secretKey: "secret"
          vaultSecretEngine:
            genericKV2SecretEngine:
              authenticationId: "cbci-oc"
              mountPath: "secret-v2"
              path: "cbci-oc/secret-b"
