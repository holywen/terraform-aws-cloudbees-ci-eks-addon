# Testing "Allow client controllers to opt-out" (docs:
# https://docs.cloudbees.com/docs/cloudbees-ci/latest/secure/using-sso#configure-options-for-controllers).
# securitySettingsEnforcement.global picks ONE of realmAndAuthorization / realmOnly /
# noSecurityEnforcer -- confirmed live against this OC's own
# /configuration-as-code/schema (2026-09-24, chart 3.37914.0+c9bda104ea71).
#
# SWITCHED BACK to realmAndAuthorization 2026-09-25, TEMPORARILY, single-variable
# before/after test: with root-scope-test-group's grant unchanged (references
# oc-enforcement-marker-role, which exists ONLY in oc/rbac.yaml -- no same-name
# confound), realmOnly just returned 403 on every endpoint for root-scope-test-sa
# (whoAmI confirmed authenticated:true but authorities == only
# [authenticated, cloudbees-ci-service-account] -- the marker role's grant never
# resolved). Flipping to realmAndAuthorization with nothing else changed to see
# whether the SAME grant now resolves to real Hudson.Read permissions. This directly
# tests the user's original claim ("sso only: the controller has to define its own
# roles") against my prior generalization (Follow-up #6, which used the same-named
# `browse` role and never actually proved centralized resolution under realmOnly).
# See Test5_Results_SecurityEnforcement_OptOut.md, Follow-up #7.
security:
  securitySettingsEnforcement:
    global:
      realmAndAuthorization:
        canOverride: true
jenkins:
  securityRealm:
    ldap:
      configurations:
      - managerDN: ${ldapManagerDN}
        managerPasswordSecret: ${sec_globalPassword}
        rootDN: ${ldapRootDN}
        server: ${ldapServer}
        userSearch: ${ldapUserSearch}
  authorizationStrategy: "cloudBeesRoleBasedAccessControl"
  remotingSecurity:
    enabled: true
  # excludeClientIPFromCrumb was removed from hudson.security.csrf.DefaultCrumbIssuer
  # in the newer Jenkins core shipped by CloudBees CI 2.568.2.37664 (this bundle
  # previously targeted 2.516.1.28669, pinned by a stale Terraform module default --
  # see main.k8s.tf). Its removal is a CSRF-hardening change upstream, not a
  # regression: dropping it just means crumbs are no longer weakened by excluding
  # the client IP, which is the safer default anyway. Leaving crumbIssuer unset
  # entirely (rather than an empty `standard: {}`) uses Jenkins' own default
  # crumb issuer.
globalCredentialsConfiguration:
  vaultGlobalConfiguration:
    authentications:
    - appRoleAuthentication:
        id: "cbci-oc"
        roleId: "REPLACE_ME"
        secretId: "REPLACE_ME"
    skipSslVerification: true
    url: "${vault_url}"
credentials:
  system:
  cloudbeesHashicorpVault:
    domainCredentials:
    - credentials:
      - vaultUsernamePassword:
          description: "cbci-oc/secret-a"
          id: "cbci-oc_secret-a"
          passwordKey: "password"
          usernameKey: "username"
          vaultSecretEngine:
            genericKV2SecretEngine:
              authenticationId: "cbci-oc"
              mountPath: "secret-v2"
              path: "cbci-oc/secret-a"
      - vaultSecretText:
          description: "cbci-oc/secret-b"
          id: "cbci-oc_secret-b"
          secretKey: "secret"
          vaultSecretEngine:
            genericKV2SecretEngine:
              authenticationId: "cbci-oc"
              mountPath: "secret-v2"
              path: "cbci-oc/secret-b"
