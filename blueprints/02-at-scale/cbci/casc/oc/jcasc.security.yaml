# Testing "Allow client controllers to opt-out" (docs:
# https://docs.cloudbees.com/docs/cloudbees-ci/latest/secure/using-sso#configure-options-for-controllers).
# securitySettingsEnforcement.global picks ONE of realmAndAuthorization / realmOnly /
# noSecurityEnforcer -- confirmed live against this OC's own
# /configuration-as-code/schema (2026-09-24, chart 3.37914.0+c9bda104ea71).
#
# CORRECTED 2026-09-24 (was realmOnly): realmOnly never enforces authorization on ANY
# controller, opted-out or not -- so it can't produce a clean A/B between an opted-out
# controller and a default one; both look identical (both independently authorized).
# Switched to realmAndAuthorization (= UI's "Single Sign-On (security realm and
# authorization strategy)", the default/tightest mode) with canOverride: true (= the
# "Allow client controllers to opt-out" checkbox). Now: team-b (left at "Use global
# security enforcement") gets BOTH its securityRealm and authorizationStrategy pushed
# and overridden by the OC; team-a (opted out to "Enforce Authentication only", set via
# the OC UI -- see Test5_Results_SecurityEnforcement_OptOut.md) keeps the OC's SSO
# *realm* but its own independent authorizationStrategy/rbac.yaml. That's the real A/B
# this feature is supposed to provide for R2/R3/R4 (see ../mc/mc-parent/rbac.yaml and
# ../../../tickets/Secondary_Findings_Product_Bugs.md #9, #12, #13).
#
# The per-controller side ("Enforce Authentication only" vs "Opt Out of all security
# enforcement") is NOT exposed in this schema -- it's a controller-item-level property
# (com.cloudbees.opscenter.server.security.SecurityEnforcer$OptOutProperty /
# securityEnforcerOptOutMode), UI-only, confirmed via Secondary_Findings_Product_Bugs.md
# #13.
security:
  securitySettingsEnforcement:
    global:
      realmAndAuthorization:
        canOverride: true
jenkins:
  securityRealm:
    ldap:
      configurations:
      - managerDN: ${ldapManagerDN}
        managerPasswordSecret: ${sec_globalPassword}
        rootDN: ${ldapRootDN}
        server: ${ldapServer}
        userSearch: ${ldapUserSearch}
  authorizationStrategy: "cloudBeesRoleBasedAccessControl"
  remotingSecurity:
    enabled: true
  # excludeClientIPFromCrumb was removed from hudson.security.csrf.DefaultCrumbIssuer
  # in the newer Jenkins core shipped by CloudBees CI 2.568.2.37664 (this bundle
  # previously targeted 2.516.1.28669, pinned by a stale Terraform module default --
  # see main.k8s.tf). Its removal is a CSRF-hardening change upstream, not a
  # regression: dropping it just means crumbs are no longer weakened by excluding
  # the client IP, which is the safer default anyway. Leaving crumbIssuer unset
  # entirely (rather than an empty `standard: {}`) uses Jenkins' own default
  # crumb issuer.
globalCredentialsConfiguration:
  vaultGlobalConfiguration:
    authentications:
    - appRoleAuthentication:
        id: "cbci-oc"
        roleId: "REPLACE_ME"
        secretId: "REPLACE_ME"
    skipSslVerification: true
    url: "${vault_url}"
credentials:
  system:
  cloudbeesHashicorpVault:
    domainCredentials:
    - credentials:
      - vaultUsernamePassword:
          description: "cbci-oc/secret-a"
          id: "cbci-oc_secret-a"
          passwordKey: "password"
          usernameKey: "username"
          vaultSecretEngine:
            genericKV2SecretEngine:
              authenticationId: "cbci-oc"
              mountPath: "secret-v2"
              path: "cbci-oc/secret-a"
      - vaultSecretText:
          description: "cbci-oc/secret-b"
          id: "cbci-oc_secret-b"
          secretKey: "secret"
          vaultSecretEngine:
            genericKV2SecretEngine:
              authenticationId: "cbci-oc"
              mountPath: "secret-v2"
              path: "cbci-oc/secret-b"
