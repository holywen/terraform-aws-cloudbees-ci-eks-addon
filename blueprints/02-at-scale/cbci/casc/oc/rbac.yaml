# RE-ADDED 2026-09-28, user-requested re-test: Test 1 (Ticket #277627,
# Group/CreateToken scoping) was originally run 2026-08-17, entirely BEFORE
# securitySettingsEnforcement.global was ever introduced to this bundle
# (first added 2026-09-24) -- meaning Test 1 ran under whatever the
# unconfigured default is, which is CloudBees's documented default of full
# OC authorization ("sso + rbac" / realmAndAuthorization-equivalent), not
# "sso only". Re-adding the exact same fixtures now, under the CURRENT live
# global mode (realmOnly), to test whether the result differs. See
# Test1_Results_Ticket_277627_CreateToken_Scoping.md for the original run,
# and its "Re-test under sso only" section for this one.
- filterable: false
  permissions:
  - hudson.model.Hudson.Read
  - hudson.model.Item.Read
  - hudson.model.Item.Discover
  - nectar.plugins.rbac.groups.Group.Manage
  - nectar.plugins.rbac.groups.Group.CreateToken
  name: sa-token-manager
# Distinctive marker role, deliberately named so it exists ONLY here (OC's own
# rbac.yaml) and NOT in mc/mc-parent/rbac.yaml -- added 2026-09-24 to fix a real
# flaw in the SecurityEnforcer opt-out A/B test (Test5_Results_SecurityEnforcement_OptOut.md):
# OC's roles.administer/develop/browse share names with mc-parent's own roles, so
# comparing team-a vs team-b's assignable-roles list could never distinguish
# "OC pushed its own rbac.yaml" from "the controller used its own independent
# bundle" -- both would show the same 3 names either way. This role's presence
# (or absence) on team-a (opted out) vs team-b (fully enforced) is the actual signal.
- filterable: true
  permissions:
  - hudson.model.Hudson.Read
  name: oc-enforcement-marker-role
# K8s ServiceAccount (EKS OIDC) evaluation. serviceAccountOidcIssuerDomains
# is ONLY valid in the Operations Center's own rbac.yaml (confirmed via
# CloudBees docs after this exact property, mistakenly added to
# mc-parent/rbac.yaml, caused a schema validation error that cascaded into
# the ENTIRE mc-parent/mc-none-ha bundle chain failing validation for every
# managed controller -- see tickets/Secondary_Findings_Product_Bugs.md
# finding #6 for the full story). EKS cluster OIDC issuers use this domain
# regardless of AWS account/region/cluster -- the actual binding to one
# specific cluster comes from the exact issuer URL (including the
# cluster's unique ID) set per service account, not from this allow-list.
#
# Test 2 follow-up: re-adding the Microsoft Entra ID (Azure AD) v2.0 issuer
# domain alongside the EKS one, this time to prove out FOLDER-scoped RBAC
# for an Entra-ID-authenticated service account (Test 2 originally only
# proved root-scoped access -- see tickets/Test2_Results_Ticket_277728_OIDC_EntraID.md).
# A SEPARATE folder-scoped identity of the same name (Squad_Y/entra-oidc-sa)
# also lives in mc/mc-parent/items.squad_y-folder.yaml, same pattern as
# eks-oidc-sa. That's a distinct RBAC object from the root-scoped one below
# -- root and folder scope don't share state, so restoring the original
# Test 2 root-scoped identity here (2026-09-03, after Demo_Runbook_ServiceAccount_OIDC.md's
# Act 2.3 was found still targeting root/cjoc for this identity) does not
# affect the Squad_Y-scoped one at all.
serviceAccountOidcIssuerDomains:
  - amazonaws.com
  - login.microsoftonline.com
serviceAccounts:
- name: entra-oidc-sa
  authentication:
  - type: oidc
    id: entra-id-oidc
    issuer: "https://login.microsoftonline.com/97f9ccac-e200-42e0-b725-6e50e4d235b8/v2.0"
    subject: "80829c76-7168-4889-af8b-80570637964d"
    audience: "bbd6d52f-32dc-467c-956b-807734dad4ba"
# Test 1 re-test fixtures (2026-09-28), same shape as the original 2026-08-17
# run -- see the sa-token-manager role comment above.
- name: sa-scope-test-item
  authentication:
  - type: password
    id: sa-scope-test-item-token
    description: "Test 1 re-test Scenario A actor token"
    password: cloudbees_ci_sa_20007428430820cbc3b1102fb4049ff1
- name: sa-scope-test-root
  authentication:
  - type: password
    id: sa-scope-test-root-token
    description: "Test 1 re-test Scenario B actor token"
    password: cloudbees_ci_sa_fd0f4c1acb2ab41bb79d039c4d8df8c1
- name: root-target-sa
  authentication: []
groups:
- members:
    external_groups:
    - CI_Admins
  roles:
  - name: administer
    grantedAt: current
  name: Administrators
- members:
    serviceAccounts:
    - sa-scope-test-root
  roles:
  - name: sa-token-manager
    grantedAt: current
  name: root-token-managers
- members:
    external_groups:
    - Dev_Team_X
    - Dev_Team_Y
  roles:
  - name: browse
    grantedAt: current
    propagates: false
  name: Developers
- members:
    serviceAccounts:
    - entra-oidc-sa
  roles:
  # Least-privilege by default for this root-scoped demo identity: read-only
  # (browse), just enough for Act 2.3's whoAmI proof-of-auth. Bump to
  # develop/administer (or restore the original sa-token-manager role from
  # Test 1/Test 2, since removed from this file) if a specific root-level
  # capability needs demoing.
  - name: browse
    grantedAt: current
  name: entra-sa-root-group
