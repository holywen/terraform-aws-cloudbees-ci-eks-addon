# TEST 3 (Ticket #277728 follow-up): direct user grant for the real Entra ID
# account used to verify interactive OIDC login. userNameField is
# "preferred_username", which for this personal-tenant account is the
# account's email address. Kept live (not just historical) -- this is the
# realm actually in use, not test scaffolding.
- members:
    users:
    - holywen@hotmail.com
  roles:
  - name: administer
    grantedAt: current
  name: entra-enduser-admins
# TEST 3 follow-up: group-claim mapping. mawuku@cloudbees.com and
# shaohua.wen@gmail.com have NO direct grant -- their access depends solely
# on membership in the "cbci-oidc-group-test" Entra ID security group
# (object id 00b5feea-9a1d-4640-8f6a-8d0fb1d9303d). Matches on the group's
# OBJECT ID (GUID), not its display name -- see groupsFieldName note in
# jcasc.security.yaml. See tickets/Test3_Results_EndUser_OIDC_EntraID.md.
- members:
    external_groups:
    - 00b5feea-9a1d-4640-8f6a-8d0fb1d9303d
  roles:
  - name: administer
    grantedAt: current
  name: entra-group-admins
- members:
    external_groups:
    - Dev_Team_X
    - Dev_Team_Y
  roles:
  - name: browse
    grantedAt: current
    propagates: false
  name: Developers
