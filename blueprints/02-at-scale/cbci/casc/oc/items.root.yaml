removeStrategy:
  rbac: SYNC
  items: NONE
items:
  - kind: managedController
    name: team-a
    configuration:
      kubernetes:
        memory: 2048
        cpus: 1.0
        disk: 10
        nodeSelectors: topology.kubernetes.io/zone=${sec_awsRegion}a,role=cb-apps
        storageClassName: "gp3-a"
    # ROOT CAUSE (confirmed live, see tickets/Secondary_Findings_Product_Bugs.md):
    # relying on cloudBeesCasCServer.defaultBundle (oc/jcasc.main.yaml) instead
    # of an explicit configurationAsCode.bundle property here means NO CasC
    # content (plugins/jcasc/rbac/items) is ever pushed to this controller --
    # confirmed by team-b/team-c-ha (which both set this explicitly) getting
    # full content while team-a/team-d (which didn't) got none, on the SAME
    # fresh deploy. Explicit property, matching team-b's mc-none-ha bundle.
    properties:
      - configurationAsCode:
          bundle: "${cascBranch}/mc-none-ha"
  # TEST 4: fresh managed controller, provisioned to replace team-a as the
  # live verification target after team-a's item got stuck in a permanent
  # PROVISIONING_ERROR (its `resource` object was nulled via a "Force
  # Deprovision" UI action during troubleshooting, and CloudBees's own
  # provisioning code NPEs on getDomain() when resource is null instead of
  # rebuilding it -- a real product bug, not a CasC content problem; see
  # tickets/Secondary_Findings_Product_Bugs.md). Same Squad_X folder +
  # eks-oidc-sa group-claim RBAC applies here too via mc-none-ha -> mc-parent.
  - kind: managedController
    name: team-d
    configuration:
      kubernetes:
        memory: 2048
        cpus: 1.0
        disk: 10
        nodeSelectors: topology.kubernetes.io/zone=${sec_awsRegion}a,role=cb-apps
        storageClassName: "gp3-a"
    properties:
      - configurationAsCode:
          bundle: "${cascBranch}/mc-none-ha"
  # Casc, Non-HA
  - kind: managedController
    name: team-b
    configuration:
      kubernetes:
        memory: 6144
        cpus: 2.0
        disk: 5
        nodeSelectors: topology.kubernetes.io/zone=${sec_awsRegion}a,role=cb-apps
        storageClassName: "gp3-a"
        yaml: |-
          ---
          apiVersion: "apps/v1"
          kind: "StatefulSet"
          spec:
            template:
              spec:
                tolerations:
                - key: "dedicated"
                  operator: "Equal"
                  value: "cb-apps"
                  effect: "NoSchedule"
                volumes:
                - name: cbci-secrets
                  secret:
                    secretName: ${cascSecretsName}
                containers:
                - name: jenkins
                  env:
                  - name: SECRETS
                    value: "/var/run/secrets/cbci"
                  volumeMounts:
                  - name: cbci-secrets
                    mountPath: "/var/run/secrets/cbci"
                    readOnly: true
          ---
          apiVersion: "v1"
          kind: "Service"
          metadata:
            labels:
              "cloudbees.prometheus": "true"
    properties:
      - configurationAsCode:
          bundle: "${cascBranch}/mc-none-ha"
  # Casc, HA
  - kind: managedController
    name: team-c-ha
    configuration:
      kubernetes:
        memory: 6144
        cpus: 2.0
        disk: 5
        nodeSelectors: role=cb-apps
        storageClassName: "efs"
        replication:
          config:
            maxReplicas: 4
            replicas: 2
            targetCPUUtilizationPercentage: 50
        yaml: |-
          ---
          apiVersion: "apps/v1"
          kind: "Deployment"
          spec:
            template:
              spec:
                tolerations:
                - key: "dedicated"
                  operator: "Equal"
                  value: "cb-apps"
                  effect: "NoSchedule"
                volumes:
                - name: cbci-secrets
                  secret:
                    secretName: ${cascSecretsName}
                containers:
                - name: jenkins
                  env:
                  - name: SECRETS
                    value: "/var/run/secrets/cbci"
                  volumeMounts:
                  - name: cbci-secrets
                    mountPath: "/var/run/secrets/cbci"
                    readOnly: true
          ---
          apiVersion: "v1"
          kind: "Service"
          metadata:
            labels:
              "cloudbees.prometheus": "true"
    properties:
      - configurationAsCode:
          bundle: "${cascBranch}/mc-ha"
