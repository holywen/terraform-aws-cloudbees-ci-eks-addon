removeStrategy:
  rbac: SYNC
  items: NONE
items:
  # Non-Casc
  - kind: managedController
    name: team-a
    configuration:
      kubernetes:
        memory: 2048
        cpus: 1.0
        disk: 10
        nodeSelectors: topology.kubernetes.io/zone=${sec_awsRegion}a,role=cb-apps
        storageClassName: "gp3-a"
        # Mount the shared secrets volume (team-b/team-c-ha already had this;
        # team-a was missing it). Without it, sec_-prefixed CasC secret
        # variables (e.g. sec_adminMail, used by mc-parent's jcasc.support.yaml
        # advisor block) resolve to an empty string for this controller only,
        # via i.j.p.c.SecretSourceResolver$UnresolvedLookup. That was silently
        # tolerated by the older CBCI release this environment was previously
        # (accidentally) pinned to, but CloudBees Jenkins Advisor's email
        # validation in the current release hard-fails CasC boot on an empty
        # email -- surfaced only after fixing the Helm chart version pin.
        yaml: |-
          ---
          apiVersion: "apps/v1"
          kind: "StatefulSet"
          spec:
            template:
              spec:
                volumes:
                - name: cbci-secrets
                  secret:
                    secretName: ${cascSecretsName}
                containers:
                - name: jenkins
                  env:
                  - name: SECRETS
                    value: "/var/run/secrets/cbci"
                  volumeMounts:
                  - name: cbci-secrets
                    mountPath: "/var/run/secrets/cbci"
                    readOnly: true
    # Explicit bundle assignment (not just relying on cloudBeesCasCServer's
    # defaultBundle) -- prior investigation found this at minimum makes the
    # OC's own bundle validation succeed cleanly; see
    # tickets/Secondary_Findings_Product_Bugs.md finding #6 for the fuller,
    # still partly unresolved story around managed-controller CasC delivery.
    properties:
      - configurationAsCode:
          bundle: "${cascBranch}/mc-none-ha"
  # Casc, Non-HA
  - kind: managedController
    name: team-b
    configuration:
      kubernetes:
        memory: 6144
        cpus: 2.0
        disk: 5
        nodeSelectors: topology.kubernetes.io/zone=${sec_awsRegion}a,role=cb-apps
        storageClassName: "gp3-a"
        yaml: |-
          ---
          apiVersion: "apps/v1"
          kind: "StatefulSet"
          spec:
            template:
              spec:
                tolerations:
                - key: "dedicated"
                  operator: "Equal"
                  value: "cb-apps"
                  effect: "NoSchedule"
                volumes:
                - name: cbci-secrets
                  secret:
                    secretName: ${cascSecretsName}
                containers:
                - name: jenkins
                  env:
                  - name: SECRETS
                    value: "/var/run/secrets/cbci"
                  volumeMounts:
                  - name: cbci-secrets
                    mountPath: "/var/run/secrets/cbci"
                    readOnly: true
          ---
          apiVersion: "v1"
          kind: "Service"
          metadata:
            labels:
              "cloudbees.prometheus": "true"
    properties:
      - configurationAsCode:
          bundle: "${cascBranch}/mc-none-ha"
  # Casc, HA
  # team-c-ha REMOVED (isolated) from this bundle: a genuine CloudBees product
  # bug in the master-provisioning-kubernetes plugin's HPA reconciliation
  # (com.cloudbees.masterprovisioning.kubernetes.Replication.rollingUpgrade)
  # sends a server-side-apply PATCH for team-c-ha's HorizontalPodAutoscaler
  # that omits spec.scaleTargetRef.name (a required, non-nullable field) --
  # this is caused by team-c-ha's `configuration.kubernetes.replication.config`
  # (maxReplicas/replicas/targetCPUUtilizationPercentage) CasC autoscaling
  # feature, reproduced even against a pre-existing, correctly-configured HPA
  # object. The resulting HTTP 422 throws INSIDE the single batch loop that
  # rolls every managed controller onto a new image after a CBCI version
  # bump, aborting the ENTIRE batch before it reaches team-a/team-b -- i.e.
  # one HA controller's broken autoscaling config silently blocks every other
  # managed controller's upgrade. See tickets/Secondary_Findings_Product_Bugs.md
  # for the full writeup. Isolated here (removed from the OC's own bundle,
  # matching the isolation approach already used earlier in this
  # investigation) since team-c-ha is not in scope for the Test 4 EKS
  # ServiceAccount OIDC evaluation, which targets team-a/Squad_X.
