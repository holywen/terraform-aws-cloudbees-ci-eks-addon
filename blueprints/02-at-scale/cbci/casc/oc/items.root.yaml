removeStrategy:
  rbac: SYNC
  items: NONE
items:
  # Non-Casc
  - kind: managedController
    name: team-a
    configuration:
      kubernetes:
        memory: 2048
        cpus: 1.0
        disk: 10
        nodeSelectors: topology.kubernetes.io/zone=${sec_awsRegion}a,role=cb-apps
        storageClassName: "gp3-a"
    # TEST 1 (Ticket #277627): item-scoped target SA + a group that grants
    # sa-token-manager (Group/CreateToken) ONLY at team-a's item scope
    # (Scenario A). Per docs, this should have NO effect at all, even for
    # ca-target-sa in this same item.
    serviceAccounts:
    - name: ca-target-sa
      authentication: []
    groups:
    - name: team-a-token-managers
      roles:
      - name: sa-token-manager
        grantedAt: current
      members:
        serviceAccounts:
        - sa-scope-test-item
  # Casc, Non-HA
  - kind: managedController
    name: team-b
    configuration:
      kubernetes:
        memory: 6144
        cpus: 2.0
        disk: 5
        nodeSelectors: topology.kubernetes.io/zone=${sec_awsRegion}a,role=cb-apps
        storageClassName: "gp3-a"
    # TEST 1 (Ticket #277627): item-scoped target SA on a SIBLING controller,
    # used to check whether Scenario B's ROOT-granted sa-token-manager (see
    # rbac.yaml root-token-managers group) can reach tokens on a controller
    # it was never explicitly scoped to.
    serviceAccounts:
    - name: cb-target-sa
      authentication: []
        yaml: |-
          ---
          apiVersion: "apps/v1"
          kind: "StatefulSet"
          spec:
            template:
              spec:
                tolerations:
                - key: "dedicated"
                  operator: "Equal"
                  value: "cb-apps"
                  effect: "NoSchedule"
                volumes:
                - name: cbci-secrets
                  secret:
                    secretName: ${cascSecretsName}
                containers:
                - name: jenkins
                  env:
                  - name: SECRETS
                    value: "/var/run/secrets/cbci"
                  volumeMounts:
                  - name: cbci-secrets
                    mountPath: "/var/run/secrets/cbci"
                    readOnly: true
          ---
          apiVersion: "v1"
          kind: "Service"
          metadata:
            labels:
              "cloudbees.prometheus": "true"
    properties:
      - configurationAsCode:
          bundle: "${cascBranch}/mc-none-ha"
  # Casc, HA
  - kind: managedController
    name: team-c-ha
    configuration:
      kubernetes:
        memory: 6144
        cpus: 2.0
        disk: 5
        nodeSelectors: role=cb-apps
        storageClassName: "efs"
        replication:
          config:
            maxReplicas: 4
            replicas: 2
            targetCPUUtilizationPercentage: 50
        yaml: |-
          ---
          apiVersion: "apps/v1"
          kind: "Deployment"
          spec:
            template:
              spec:
                tolerations:
                - key: "dedicated"
                  operator: "Equal"
                  value: "cb-apps"
                  effect: "NoSchedule"
                volumes:
                - name: cbci-secrets
                  secret:
                    secretName: ${cascSecretsName}
                containers:
                - name: jenkins
                  env:
                  - name: SECRETS
                    value: "/var/run/secrets/cbci"
                  volumeMounts:
                  - name: cbci-secrets
                    mountPath: "/var/run/secrets/cbci"
                    readOnly: true
          ---
          apiVersion: "v1"
          kind: "Service"
          metadata:
            labels:
              "cloudbees.prometheus": "true"
    properties:
      - configurationAsCode:
          bundle: "${cascBranch}/mc-ha"
