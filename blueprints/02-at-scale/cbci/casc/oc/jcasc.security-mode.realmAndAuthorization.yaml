# "SSO + RBAC" enforcement mode -- switchable file, see jcasc.security.yaml's
# header comment for how this pairs with jcasc.security-mode.realmOnly.yaml.
# To activate this mode: reference THIS file (not the realmOnly one) in
# bundle.yaml's `jcasc:` list, bump the version, redeploy (cjoc-0 restart,
# then restart any managed controller pods that need to pick up the change).
#
# securitySettingsEnforcement.global picks ONE of realmAndAuthorization /
# realmOnly / noSecurityEnforcer -- confirmed live against this OC's own
# /configuration-as-code/schema (2026-09-24, chart 3.37914.0+c9bda104ea71).
# This is the CBCI-documented default when the key is left undeclared
# entirely (the original Test 1 run, 2026-08-17, predates this key). Confirmed
# via Test5_Results_SecurityEnforcement_OptOut.md Follow-up #7 and this
# ticket's Test 1 redesign that enforcement mode makes zero difference to
# every RBAC reach/isolation question tested so far -- both modes behave
# identically on every axis. This split into two ready-to-swap files exists
# purely to make future single-variable mode comparisons faster and
# lower-risk, not because a different result is expected.
security:
  securitySettingsEnforcement:
    global:
      realmAndAuthorization:
        canOverride: true
